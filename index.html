function avgByDate(entries, field) {
  const map = new Map();
  entries.forEach((e) => {
    const v = e[field];
    if (v === null || v === undefined || v === "") return;
    if (!map.has(e.date)) map.set(e.date, { sum: 0, count: 0 });
    const g = map.get(e.date);
    g.sum += Number(v);
    g.count += 1;
  });
  return [...map.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([date, g]) => ({ date, value: g.sum / g.count }));
}
function calcBMI(weightKg, heightCm) {
  if (!weightKg || !heightCm) return null;
  const h = heightCm / 100;
  return weightKg / (h * h);
}
function calcStandardWeight(heightCm) {
  if (!heightCm) return null;
  const h = heightCm / 100;
  return 22 * h * h;
}
function bmiLabel(bmi) {
  if (bmi == null) return "";
  if (bmi < 18.5) return "低体重";
  if (bmi < 25) return "標準";
  if (bmi < 30) return "肥満(1度)";
  if (bmi < 35) return "肥満(2度)";
  if (bmi < 40) return "肥満(3度)";
  return "肥満(4度)";
}
function targetBmiRange(age) {
  if (!age) return [18.5, 24.9];
  if (age < 50) return [18.5, 24.9];
  if (age < 65) return [20.0, 24.9];
  return [21.5, 24.9];
}
// 一般的な基礎代謝(ミフリン・セントジオール式): 年齢・身長・体重・性別から算出
function calcBMRStandard(weightKg, heightCm, age, gender) {
  if (!weightKg || !heightCm || !age) return null;
  const base = 10 * weightKg + 6.25 * heightCm - 5 * age;
  return gender === "female" ? base - 161 : base + 5;
}
// 筋肉量を加味した基礎代謝(キャッチ・マックardle式): 除脂肪体重(≒筋肉量)から算出。年齢・性別に依存しないため実測値の変化がより反映される
function calcBMRLeanMass(leanMassKg) {
  if (!leanMassKg) return null;
  return 370 + 21.6 * leanMassKg;
}
function computeBMR(latestWeight, profile) {
  const height = Number(profile.height) || null;
  const age = Number(profile.age) || null;
  if (!latestWeight) return { standard: null, leanMass: null, leanMassBMR: null };
  const leanMass = latestWeight.muscleMass ?? (latestWeight.bodyFat != null ? latestWeight.weight * (1 - latestWeight.bodyFat / 100) : null);
  const standard = height && age ? calcBMRStandard(latestWeight.weight, height, age, profile.gender || "male") : null;
  return { standard, leanMass, leanMassBMR: calcBMRLeanMass(leanMass) };
}
// 歩数からの推定消費カロリー(簡易目安): 体重が重いほど1歩あたりの消費が増える近似式
function estimateStepsKcal(steps, weightKg) {
  if (!steps) return 0;
  return steps * (weightKg || 60) * 0.0005;
}

// 種目名からMETs(運動強度)を推定するための対応表(ざっくり目安)
// secondsPerRep がある種目は、時間の代わりに回数からも推定できる(1回あたりの目安秒数)
const MET_TABLE = [
  { keywords: ["早歩き", "速歩き"], met: 4.3 },
  { keywords: ["散歩", "ウォーキング", "歩く"], met: 3.5 },
  { keywords: ["ジョギング"], met: 7.0 },
  { keywords: ["ランニング", "走る", "マラソン"], met: 9.8 },
  { keywords: ["スクワット"], met: 5.0, secondsPerRep: 3 },
  { keywords: ["腕立て", "プッシュアップ"], met: 8.0, secondsPerRep: 2.5 },
  { keywords: ["腹筋", "クランチ", "シットアップ"], met: 8.0, secondsPerRep: 2.5 },
  { keywords: ["懸垂", "チンニング"], met: 8.0, secondsPerRep: 4 },
  { keywords: ["ランジ"], met: 5.0, secondsPerRep: 3 },
  { keywords: ["バーピー"], met: 8.0, secondsPerRep: 4 },
  { keywords: ["プランク"], met: 4.0 },
  { keywords: ["筋トレ", "筋力トレーニング", "ウェイト"], met: 5.0 },
  { keywords: ["ヨガ"], met: 2.5 },
  { keywords: ["ピラティス"], met: 3.0 },
  { keywords: ["ストレッチ"], met: 2.3 },
  { keywords: ["水泳", "スイミング", "泳ぐ"], met: 6.0 },
  { keywords: ["自転車", "サイクリング"], met: 6.0 },
  { keywords: ["縄跳び", "なわとび"], met: 10.0 },
  { keywords: ["階段"], met: 8.0 },
  { keywords: ["バスケ"], met: 6.5 },
  { keywords: ["サッカー"], met: 7.0 },
  { keywords: ["テニス"], met: 7.0 },
  { keywords: ["ゴルフ"], met: 4.3 },
  { keywords: ["卓球"], met: 4.0 },
  { keywords: ["バドミントン"], met: 5.5 },
  { keywords: ["登山", "ハイキング"], met: 6.0 },
  { keywords: ["ダンス"], met: 5.0 },
  { keywords: ["エアロビクス", "HIIT"], met: 7.3 },
];
// 種目名・時間(分)・回数・体重からおおよその消費カロリーを推定(METs×体重kg×時間h×1.05)
// 時間が未入力で回数がある場合は、種目ごとの目安秒数(secondsPerRep)から時間を逆算する
function estimateExerciseKcal(typeText, durationMin, reps, weightKg) {
  const t = (typeText || "").trim();
  if (!t) return null;
  const hit = MET_TABLE.find((row) => row.keywords.some((k) => t.includes(k)));
  if (!hit) return null;
  let minutes = Number(durationMin) || 0;
  if (!minutes && reps && hit.secondsPerRep) {
    minutes = (Number(reps) * hit.secondsPerRep) / 60;
  }
  if (!minutes) return null;
  return Math.round(hit.met * (weightKg || 60) * (minutes / 60) * 1.05);
}

async function ocrText(file) {
  if (!window.Tesseract) throw new Error("OCRライブラリの読み込みに失敗しました");
  const { data } = await Tesseract.recognize(file, "eng+jpn");
  return data.text;
}

function pickNumber(text, pattern) {
  const m = text.match(pattern);
  if (!m) return null;
  return Number(m[1].replace(/,/g, ""));
}

function pickLargestNumber(text, min, max) {
  const nums = (text.match(/[\d,]{3,7}/g) || [])
    .map((s) => Number(s.replace(/,/g, "")))
    .filter((n) => n >= min && n <= max);
  return nums.length ? Math.max(...nums) : null;
}

function toISODate(y, mo, d) {
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function inferYear(month, day) {
  const today = new Date();
  let year = today.getFullYear();
  const candidate = new Date(year, month - 1, day);
  if (candidate.getTime() > today.getTime()) year -= 1;
  return toISODate(year, month, day);
}

function parseDateFromText(text) {
  let m = text.match(/(20\d{2})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if (m) return toISODate(Number(m[1]), Number(m[2]), Number(m[3]));
  m = text.match(/(\d{1,2})月(\d{1,2})日/);
  if (m) return inferYear(Number(m[1]), Number(m[2]));
  return null;
}

async function extractSteps(file) {
  const text = await ocrText(file);
  const steps = pickNumber(text, /([\d,]{3,7})\s*歩/) ?? pickLargestNumber(text, 100, 100000);
  if (steps == null) throw new Error("歩数を読み取れませんでした。手入力してください。");
  return { steps, date: parseDateFromText(text) };
}

async function extractExercise(file) {
  const text = await ocrText(file);
  const duration = pickNumber(text, /(\d{1,4})\s*分/);
  const calories = pickNumber(text, /(\d{1,5})\s*kcal/i);
  if (duration == null && calories == null) throw new Error("時間・カロリーを読み取れませんでした。手入力してください。");
  return { duration, calories, date: parseDateFromText(text) };
}

async function bulkExtractSteps(file) {
  const text = await ocrText(file);
  const entries = [];
  const re = /([\d,]{1,7})[^\d]{0,40}?(20\d{2})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/g;
  let m;
  while ((m = re.exec(text))) {
    const steps = Number(m[1].replace(/,/g, ""));
    const date = toISODate(Number(m[2]), Number(m[3]), Number(m[4]));
    if (date && steps >= 0 && steps <= 200000) entries.push({ date, steps });
  }
  return entries;
}

async function bulkExtractWeights(file) {
  const text = await ocrText(file);
  const entries = [];
  // 曜日の丸括弧や漢字はOCRで欠落しやすいため、日付と時刻の間は種類を問わず許容する
  const headerRe = /(\d{1,2})\/(\d{1,2})[^\d\n]{0,20}?(\d{1,2}):(\d{2})/g;
  const headers = [];
  let m;
  while ((m = headerRe.exec(text))) {
    headers.push({ index: m.index, end: headerRe.lastIndex, month: Number(m[1]), day: Number(m[2]) });
  }
  for (let i = 0; i < headers.length; i++) {
    const start = headers[i].end;
    const end = i + 1 < headers.length ? headers[i + 1].index : start + 400;
    const chunk = text.slice(start, end);
    const date = inferYear(headers[i].month, headers[i].day);
    if (!date) continue;

    let weight = null;
    let bodyFat = null;
    let muscleMass = null;
    const weightM = chunk.match(/体重\D*?(\d{1,3}\.\d{1,2})/);
    const bodyFatM = chunk.match(/体脂肪率?\D*?(\d{1,2}\.\d{1,2})/);
    const muscleM = chunk.match(/筋肉量\D*?(\d{1,3}\.\d{1,2})/);
    if (weightM) weight = Number(weightM[1]);
    if (bodyFatM) bodyFat = Number(bodyFatM[1]);
    if (muscleM) muscleMass = Number(muscleM[1]);

    // ラベル(体重/体脂肪率/筋肉量)がOCRで読めなかった場合、値の並び順(体重→体脂肪率→筋肉量)と
    // 現実的な範囲から推定するフォールバック
    if (weight == null || bodyFat == null || muscleMass == null) {
      const nums = (chunk.match(/\d{1,3}\.\d{1,2}/g) || []).map(Number);
      const used = new Set([weight, bodyFat, muscleMass].filter((n) => n != null));
      const pick = (pred) => {
        for (const n of nums) {
          if (!used.has(n) && pred(n)) { used.add(n); return n; }
        }
        return null;
      };
      if (weight == null) weight = pick((n) => n >= 25 && n <= 200);
      if (bodyFat == null) bodyFat = pick((n) => n >= 3 && n <= 60);
      if (muscleMass == null) muscleMass = pick((n) => n >= 15 && n <= 120);
    }

    if (weight != null) entries.push({ date, weight, bodyFat, muscleMass });
  }
  return entries;
}

function ScreenshotButton({ color, extract, onExtract }) {
  const fileRef = useRef(null);
  const [status, setStatus] = useState("idle");
  const [errorMsg, setErrorMsg] = useState("");

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setStatus("loading");
    setErrorMsg("");
    try {
      const result = await extract(file);
      onExtract(result);
      setStatus("idle");
    } catch (err) {
      setStatus("error");
      setErrorMsg((err && err.message) || "読み取りに失敗しました");
    }
  };

  return (
    <div className="mt-2">
      <button type="button" onClick={() => fileRef.current && fileRef.current.click()}
        disabled={status === "loading"}
        className="text-[11px] font-medium flex items-center gap-1 py-1.5 px-2.5 rounded-lg"
        style={{ color, background: "#fff" }}>
        <CameraIcon size={12} color={color} strokeWidth={2.5} />
        {status === "loading" ? "読み取り中…" : "スクショから読み取る"}
      </button>
      <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      {status === "error" && <p className="text-[10px] mt-1" style={{ color: "#FF4D8D" }}>{errorMsg}</p>}
    </div>
  );
}

function BulkImportButton({ color, bg, parse, renderRow, onImport }) {
  const fileRef = useRef(null);
  const [phase, setPhase] = useState("idle");
  const [candidates, setCandidates] = useState([]);
  const [errorMsg, setErrorMsg] = useState("");

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setPhase("loading");
    setErrorMsg("");
    try {
      const records = await parse(file);
      if (records.length === 0) {
        setErrorMsg("記録を読み取れませんでした。");
        setPhase("idle");
        return;
      }
      setCandidates(records.map((r) => ({ ...r, checked: true })));
      setPhase("review");
    } catch (err) {
      setErrorMsg((err && err.message) || "読み取りに失敗しました");
      setPhase("idle");
    }
  };

  const toggle = (i) => {
    setCandidates((prev) => prev.map((c, idx) => (idx === i ? { ...c, checked: !c.checked } : c)));
  };

  const cancel = () => {
    setPhase("idle");
    setCandidates([]);
  };

  const confirm = () => {
    onImport(candidates.filter((c) => c.checked));
    cancel();
  };

  if (phase === "review") {
    const checkedCount = candidates.filter((c) => c.checked).length;
    return (
      <div className="mt-2 p-3 rounded-xl" style={{ background: bg }}>
        <p className="text-[11px] font-bold mb-2" style={{ color }}>{candidates.length}件見つかりました。内容を確認してください</p>
        <div className="space-y-1 mb-3" style={{ maxHeight: 220, overflowY: "auto" }}>
          {candidates.map((c, i) => (
            <label key={i} className="flex items-center gap-2 text-[12px] py-1.5 px-2 rounded-lg bg-white">
              <input type="checkbox" checked={c.checked} onChange={() => toggle(i)} />
              <span style={{ color: C.ink }}>{renderRow(c)}</span>
            </label>
          ))}
        </div>
        <div className="flex gap-2">
          <button type="button" onClick={confirm} disabled={checkedCount === 0}
            className="text-[11px] font-medium py-1.5 px-3 rounded-lg" style={{ background: color, color: "#fff" }}>
            {checkedCount}件を記録
          </button>
          <button type="button" onClick={cancel} className="text-[11px] font-medium py-1.5 px-3 rounded-lg" style={{ background: "#fff", color }}>
            キャンセル
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="mt-2">
      <button type="button" onClick={() => fileRef.current && fileRef.current.click()}
        disabled={phase === "loading"}
        className="text-[11px] font-medium flex items-center gap-1 py-1.5 px-2.5 rounded-lg"
        style={{ color, background: "#fff" }}>
        <CameraIcon size={12} color={color} strokeWidth={2.5} />
        {phase === "loading" ? "読み取り中…" : "スクショから一括読み込み"}
      </button>
      <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />

function HealthTracker() {
  const [data, setData] = useState({ weights: [], meals: [], exercises: [], steps: [], profile: { height: "", age: "" } });
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState("overview");
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setData((prev) => ({ ...prev, ...JSON.parse(raw) }));
    } catch (e) {
      // no existing data yet
    } finally {
      setLoading(false);
    }
  }, []);

  const persist = (next) => {
    setData(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  };

  const addWeight = (entry) => persist({ ...data, weights: [...data.weights, entry].sort((a, b) => a.date.localeCompare(b.date)) });
  const addMeal = (entry) => persist({ ...data, meals: [...data.meals, entry] });
  const addExercise = (entry) => persist({ ...data, exercises: [...data.exercises, entry] });
  const addSteps = (entry) => persist({ ...data, steps: [...data.steps, entry].sort((a, b) => a.date.localeCompare(b.date)) });
  const addManyWeights = (entries) => persist({ ...data, weights: [...data.weights, ...entries].sort((a, b) => a.date.localeCompare(b.date)) });
  const addManySteps = (entries) => persist({ ...data, steps: [...data.steps, ...entries].sort((a, b) => a.date.localeCompare(b.date)) });
  const removeItem = (category, id) => persist({ ...data, [category]: data[category].filter((x) => x.id !== id) });
  const setProfile = (patch) => persist({ ...data, profile: { ...data.profile, ...patch } });
  const updateItem = (category, id, patch) => {
    let next = data[category].map((x) => (x.id === id ? { ...x, ...patch } : x));
    if (category === "weights" || category === "steps") next = [...next].sort((a, b) => a.date.localeCompare(b.date));
    persist({ ...data, [category]: next });
  };

  if (loading) {
    return (
      <div style={{ background: C.bg, minHeight: 480 }} className="flex items-center justify-center">
        <Loader2 className="animate-spin" size={22} color={C.soft} />
      </div>
    );
  }

  return (
    <div style={{ background: C.bg, color: C.ink, fontFamily: "'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');
        .htj-tab { transition: color 0.15s ease, background 0.15s ease, transform 0.1s ease; }
        .htj-tab:active { transform: scale(0.96); }
        input::placeholder { color: #C7C3D9; }
      `}</style>

      <div className="max-w-2xl mx-auto min-h-[560px]">
        {/* Top nav */}
        <div className="flex gap-1.5 px-3 pt-4 pb-2 overflow-x-auto">
          {TABS.map((t) => {
            const Icon = t.icon;
            const active = activeTab === t.id;
            const cat = CAT[t.id];
            return (
              <button
                key={t.id}
                onClick={() => setActiveTab(t.id)}
                className="htj-tab flex-1 min-w-[64px] flex flex-col items-center gap-1 py-2.5 rounded-2xl"
                style={{ color: active ? "#fff" : C.soft, background: active ? cat.main : "transparent" }}
              >
                <Icon size={17} strokeWidth={2} />
                <span className="text-[11px] font-medium tracking-wide">{t.label}</span>
              </button>
            );
          })}
        </div>

        <div className="px-6 py-8 md:px-8">
          {activeTab === "overview" && <Overview data={data} onAddWeight={addWeight} onAddMeal={addMeal} onAddExercise={addExercise} onAddSteps={addSteps} />}
          {activeTab === "weight" && <WeightTab entries={data.weights} onAdd={addWeight} onAddMany={addManyWeights} onRemove={(id) => removeItem("weights", id)} onUpdate={(id, patch) => updateItem("weights", id, patch)} profile={data.profile} onProfileChange={setProfile} />}
          {activeTab === "meals" && <MealsTab entries={data.meals} onAdd={addMeal} onRemove={(id) => removeItem("meals", id)} onUpdate={(id, patch) => updateItem("meals", id, patch)} />}
          {activeTab === "exercise" && <ExerciseTab entries={data.exercises} onAdd={addExercise} onRemove={(id) => removeItem("exercises", id)} onUpdate={(id, patch) => updateItem("exercises", id, patch)} weightKg={data.weights.length ? data.weights[data.weights.length - 1].weight : null} />}
          {activeTab === "steps" && <StepsTab entries={data.steps} onAdd={addSteps} onAddMany={addManySteps} onRemove={(id) => removeItem("steps", id)} onUpdate={(id, patch) => updateItem("steps", id, patch)} weightKg={data.weights.length ? data.weights[data.weights.length - 1].weight : null} />}
          {saveError && <p className="text-xs mt-4" style={{ color: C.soft }}>保存に失敗しました。もう一度お試しください。</p>}
        </div>
      </div>
    </div>
  );
}

function Overview({ data, onAddWeight, onAddMeal, onAddExercise, onAddSteps }) {
  const today = todayStr();
  const todaysMeals = data.meals.filter((m) => m.date === today);
  const todaysExercise = data.exercises.filter((e) => e.date === today);
  const kcalIn = todaysMeals.reduce((s, m) => s + (Number(m.calories) || 0), 0);
  const kcalOut = todaysExercise.reduce((s, e) => s + (Number(e.calories) || 0), 0);
  const latestWeight = data.weights[data.weights.length - 1];
  const firstWeight = data.weights[0];
  const weightDelta = latestWeight && firstWeight ? (latestWeight.weight - firstWeight.weight).toFixed(1) : null;
  const profileHeight = Number(data.profile.height) || null;
  const bmi = profileHeight && latestWeight ? calcBMI(latestWeight.weight, profileHeight) : null;
  const todaysStepsEntries = data.steps.filter((s) => s.date === today);
  const todaysSteps = todaysStepsEntries[todaysStepsEntries.length - 1];

  const { standard: bmrStandard, leanMassBMR } = computeBMR(latestWeight, data.profile);
  const bmr = leanMassBMR ?? bmrStandard;
  const stepsKcal = estimateStepsKcal(todaysSteps ? todaysSteps.steps : 0, latestWeight ? latestWeight.weight : null);
  const totalBurn = bmr != null ? bmr + stepsKcal + kcalOut : null;
  const balance = totalBurn != null ? kcalIn - totalBurn : null;

  const weightChart = avgByDate(data.weights, "weight").slice(-14).map((d) => ({ date: fmtDate(d.date), 体重: Number(d.value.toFixed(1)) }));

  const dayMap = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    dayMap[key] = { date: fmtDate(key), 摂取: 0, 消費: 0 };
  }
  data.meals.forEach((m) => { if (dayMap[m.date]) dayMap[m.date].摂取 += Number(m.calories) || 0; });
  data.exercises.forEach((e) => { if (dayMap[e.date]) dayMap[e.date].消費 += Number(e.calories) || 0; });
  const calChart = Object.values(dayMap);

  const stepsMap = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    stepsMap[key] = { date: fmtDate(key), 歩数: 0 };
  }
  data.steps.forEach((s) => { if (stepsMap[s.date]) stepsMap[s.date].歩数 = Number(s.steps) || 0; });
  const stepsChart = Object.values(stepsMap);

  return (
    <div>
      <SectionHeader title="今日" sub={new Date().toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" })} />

      <div className="grid gap-3 mb-9" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))" }}>
        <Stat label="体重" value={latestWeight ? latestWeight.weight : "—"} unit="kg" extra={weightDelta ? `${weightDelta > 0 ? "+" : ""}${weightDelta}` : null} color={CAT.weight.main} bg={CAT.weight.soft} />
        <Stat label="歩数" value={todaysSteps ? todaysSteps.steps.toLocaleString() : "—"} unit="歩" color={CAT.steps.main} bg={CAT.steps.soft} />
        <Stat label="摂取" value={todaysMeals.length ? kcalIn : "—"} unit="kcal" color={CAT.meals.main} bg={CAT.meals.soft} />
        <Stat label="消費" value={todaysExercise.length ? kcalOut : "—"} unit="kcal" color={CAT.exercise.main} bg={CAT.exercise.soft} />
        {bmi != null && <Stat label="BMI" value={bmi.toFixed(1)} unit="" extra={bmiLabel(bmi)} color={CAT.weight.main} bg={CAT.weight.soft} />}
        {bmr != null && <Stat label="基礎代謝" value={Math.round(bmr)} unit="kcal" color={CAT.weight.main} bg={CAT.weight.soft} />}
      </div>

      {totalBurn != null && (
        <div className="mb-9 p-4 rounded-2xl" style={{ background: balance > 0 ? CAT.exercise.soft : CAT.weight.soft }}>
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs font-bold" style={{ color: balance > 0 ? CAT.exercise.main : CAT.weight.main }}>
              今日の収支{balance > 0 ? "・オーバー気味" : "・順調"}
            </p>
            <p className="text-sm font-bold" style={{ color: balance > 0 ? CAT.exercise.main : CAT.weight.main }}>
              {balance > 0 ? "+" : ""}{Math.round(balance)} kcal
            </p>
          </div>
          <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px]" style={{ color: C.soft }}>
            <span>摂取 {kcalIn}kcal</span>
            <span>基礎代謝 {Math.round(bmr)}kcal</span>
            <span>歩数消費(目安) {Math.round(stepsKcal)}kcal</span>
            <span>運動消費 {kcalOut}kcal</span>
          </div>
        </div>
      )}

      <div className="space-y-3 mb-9">
        <QuickAddWeight onAdd={onAddWeight} chartData={weightChart} />
        <QuickAddSteps onAdd={onAddSteps} chartData={stepsChart} />
        <QuickAddMeal onAdd={onAddMeal} chartData={calChart} />
        <QuickAddExercise onAdd={onAddExercise} chartData={calChart} weightKg={latestWeight ? latestWeight.weight : null} />
      </div>

      {data.weights.length === 0 && data.meals.length === 0 && data.exercises.length === 0 && (
        <p className="text-sm" style={{ color: C.soft }}>まだ記録がありません。下のフォームから記録を始めましょう。</p>
      )}
    </div>
  );
}

function WeightTab({ entries, onAdd, onAddMany, onRemove, onUpdate, profile, onProfileChange }) {
  const [weight, setWeight] = useState("");
  const [bodyFat, setBodyFat] = useState("");
  const [muscleMass, setMuscleMass] = useState("");
  const [date, setDate] = useState(todayStr());
  const [editingId, setEditingId] = useState(null);
  const [editDate, setEditDate] = useState(todayStr());
  const [editWeight, setEditWeight] = useState("");
  const [editBodyFat, setEditBodyFat] = useState("");
  const [editMuscleMass, setEditMuscleMass] = useState("");

  const profileHeight = Number(profile.height) || null;
  const profileAge = Number(profile.age) || null;
  const latestWeight = entries[entries.length - 1];
  const bmi = profileHeight && latestWeight ? calcBMI(latestWeight.weight, profileHeight) : null;
  const standardWeight = profileHeight ? calcStandardWeight(profileHeight) : null;
  const bmiRange = targetBmiRange(profileAge);
  const targetWeightMin = profileHeight ? bmiRange[0] * (profileHeight / 100) ** 2 : null;
  const targetWeightMax = profileHeight ? bmiRange[1] * (profileHeight / 100) ** 2 : null;

function ExerciseTab({ entries, onAdd, onRemove, onUpdate, weightKg }) {

  const [editReps, setEditReps] = useState("");
  const [editCalories, setEditCalories] = useState("");

  useEffect(() => {
    if (!caloriesAuto) return;
    const estimate = estimateExerciseKcal(type, duration, reps, weightKg);
    if (estimate != null) setCalories(String(estimate));
  }, [type, duration, reps, caloriesAuto]);

  const startEdit = (item) => {
    setEditingId(item.id);
    setEditDate(item.date);
    setEditType(item.type);
    setEditDuration(item.duration !== null && item.duration !== undefined ? String(item.duration) : "");
    setEditReps(item.reps !== null && item.reps !== undefined ? String(item.reps) : "");
    setEditCalories(item.calories != null ? String(item.calories) : "");
  };
  const cancelEdit = () => setEditingId(null);
  const saveEdit = () => {
    if (!editType) return;
    onUpdate(editingId, { date: editDate, type: editType, duration: editDuration ? Number(editDuration) : null, reps: editReps ? Number(editReps) : null, calories: editCalories ? Number(editCalories) : null });

    if (!type) return;
    onAdd({ id: uid(), time: nowTime(), date, type, duration: duration ? Number(duration) : null, reps: reps ? Number(reps) : null, calories: calories ? Number(calories) : null });
    setType(""); setDuration(""); setReps(""); setCalories(""); setCaloriesAuto(true);
  };
  const handleExtract = (result) => {
    if (result.type) setType(result.type);
    if (result.duration != null) setDuration(String(result.duration));
    if (result.calories != null) { setCalories(String(result.calories)); setCaloriesAuto(false); }

  return (
    <div>

            className={inputCls} style={inputStyle} />
        </Field>
        <Field label="時間 (分)">
          <input type="number" inputMode="numeric" placeholder="0" value={duration} onChange={(e) => setDuration(e.target.value)}
            className={inputCls} style={inputStyle} />
        </Field>
        <Field label="回数">
          <input type="number" inputMode="numeric" placeholder="0" value={reps} onChange={(e) => setReps(e.target.value)}
            className={inputCls} style={inputStyle} />
        </Field>
        <Field label="消費 (kcal)">
          <input type="number" inputMode="numeric" placeholder="0" value={calories}

            {e.reps != null ? <> ・ <Num width={22}>{e.reps}</Num>回</> : null}

          <input type="number" inputMode="numeric" placeholder="0" value={steps} onChange={(e) => setSteps(e.target.value)}
            className={inputCls} style={inputStyle} />
          {steps && <p className="text-[10px] mt-1" style={{ color: C.soft }}>推定消費 約{Math.round(estimateStepsKcal(Number(steps), weightKg))}kcal</p>}
        </Field>
        <button onClick={submit} className="text-sm font-medium flex items-center justify-center gap-1.5 py-3 px-4 rounded-xl" style={{ color: "#fff", background: CAT.steps.main, gridColumn: "1 / -1" }}>
          <Plus size={15} /> 記録
        </button>
      </div>
      <div className="-mt-7 mb-9 space-y-2">
        <ScreenshotButton color={CAT.steps.main} extract={extractSteps} onExtract={handleExtract} />
        <BulkImportButton color={CAT.steps.main} bg={CAT.steps.soft} parse={bulkExtractSteps}
          renderRow={(c) => `${c.date}  ${c.steps.toLocaleString()}歩`}
          onImport={handleBulkImport} />
      </div>

      {stepsChart.length > 1 && (
        <div className="mb-9 p-4 rounded-2xl" style={{ background: CAT.steps.soft }}>
          <p className="text-xs font-medium mb-3" style={{ color: CAT.steps.main }}>歩数の推移</p>
          <ResponsiveContainer width="100%" height={140}>
            <BarChart data={stepsChart}>
              <CartesianGrid stroke="#ffffff" strokeDasharray="2 2" vertical={false} />
              <XAxis dataKey="date" tick={chartAxis} axisLine={false} tickLine={false} />
              <YAxis tick={chartAxis} axisLine={false} tickLine={false} width={34} />
              <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: "none" }} />
              <Bar dataKey="歩数" fill={CAT.steps.main} radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}

      <EntryList items={[...entries].reverse()} onRemove={onRemove} onEdit={startEdit} editingId={editingId} color={CAT.steps.main}
        render={(e) => (
          <>
            <Num width={56}>{e.steps.toLocaleString()}</Num>歩 ・ 約<Num width={40}>{Math.round(estimateStepsKcal(e.steps, weightKg))}</Num>kcal
          </>
        )}
        renderEdit={() => (
          <div>
            <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(70px, 1fr))" }}>
              <DateField value={editDate} onChange={(e) => setEditDate(e.target.value)} wrapperStyle={{ gridColumn: "1 / -1" }}
                className={quickInputCls} />
              <input type="number" inputMode="numeric" placeholder="歩数" value={editSteps} onChange={(e) => setEditSteps(e.target.value)}
                className={quickInputCls} style={quickInputStyle} />
            </div>
            {editSteps && <p className="text-[10px] mt-1" style={{ color: C.soft }}>推定消費 約{Math.round(estimateStepsKcal(Number(editSteps), weightKg))}kcal</p>}
            <InlineEditActions onSave={saveEdit} onCancel={cancelEdit} color={CAT.steps.main} />
          </div>
        )} />
    </div>
  );
}

function EntryList({ items, onRemove, onEdit, editingId, render, renderEdit, color }) {
  if (items.length === 0) {
    return <p className="text-sm" style={{ color: C.soft }}>まだ記録がありません。</p>;
  }
  return (
    <div className="space-y-1.5">
      {items.map((item) => (
        item.id === editingId && renderEdit ? (
          <div key={item.id} className="py-2.5 px-3 rounded-xl" style={{ background: C.faint }}>
            {renderEdit(item)}
          </div>
        ) : (
          <div key={item.id} className="flex items-center justify-between gap-3 py-2.5 px-3 rounded-xl"
            style={{ background: item.id === editingId ? C.faint : C.line }}>
            <div className="flex items-center gap-3 min-w-0">
              <div className="flex flex-col items-start shrink-0" style={{ width: 44 }}>
                <span className="text-[12px] font-bold" style={{ color }}>{fmtDate(item.date)}</span>
                {item.time && <span className="text-[10px] font-medium" style={{ color: C.soft }}>{item.time}</span>}
              </div>
              <span className="text-[13px] font-semibold truncate" style={{ color: C.ink }}>{render(item)}</span>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button onClick={() => onEdit(item)} className="p-1.5 -m-1.5 hover:opacity-100 transition-opacity" style={{ opacity: 0.45 }}>
                <Pencil size={14} color={C.soft} />
              </button>
              <button onClick={() => onRemove(item.id)} className="p-1.5 -m-1.5 hover:opacity-100 transition-opacity" style={{ opacity: 0.45 }}>
                <Trash2 size={14} color={C.soft} />
              </button>
            </div>
          </div>
        )
      ))}
    </div>
  );
}

function InlineEditActions({ onSave, onCancel, color }) {
  return (
    <div className="flex gap-2 mt-2">
      <button type="button" onClick={onSave} className="text-[12px] font-medium py-1.5 px-3 rounded-lg" style={{ background: color, color: "#fff" }}>
        保存
      </button>
      <button type="button" onClick={onCancel} className="text-[12px] font-medium py-1.5 px-3 rounded-lg" style={{ background: "#fff", color }}>
        キャンセル
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<HealthTracker />);
</script>
